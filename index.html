    class GeminiClient{
      constructor(apiKey){this.apiKey=apiKey;this.model=MODEL_NAME}
      async generateContent(prompt,signal){
        if(!this.apiKey)throw Error('Gemini API Key를 입력해 주세요.');
        const url=`https://generativelanguage.googleapis.com/v1beta/models/${this.model}:generateContent?key=${encodeURIComponent(this.apiKey)}`;
        let lastError;
        for(let attempt=0;attempt<3;attempt+=1){
          try{
            const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}}),signal});
            if(!response.ok){

              if(response.status===401||response.status===403||/API key/i.test(detail))throw Error('API_KEY_INVALID');
              if(response.status===429)throw Error('RATE_LIMIT');
              if(response.status>=500)throw Error('SERVER_TEMPORARY');

            if(!responseText)throw Error('Gemini 응답 형식이 올바르지 않습니다.');
            return parseGeminiJson(responseText);

            if(!retryable||attempt===2)break;

          }
        }
        if(lastError?.message==='RATE_LIMIT')throw Error('Gemini 요청 한도에 도달했습니다. 잠시 후 다시 시도해 주세요.');

      }

    function localCandidates(){

      try{
        const workbook=XLSX.utils.book_new(),summary=[['Nemotron Persona Recommendation',''],['항목','내용'],['과제명',state.topic],['추가 설명',state.description],['분석 날짜',new Date().toLocaleString('ko-KR')],['원본 Persona 파일명',state.fileName],['원본 Sheet',state.sheetName],['전체 Persona 수',state.rows.length],['Gemini 모델',MODEL_NAME],['1차 후보 수',state.candidateCount||state.candidates.length],['최종 추천 수',state.recommendations.length],['과제 핵심 목적',state.analysis?.researchIntent||''],['주요 탐색 영역',arrayValue(state.analysis?.importantContexts).join(' | ')],['주요 행동 특성',arrayValue(state.analysis?.importantBehaviors).join(' | ')],['관련 사용자 유형',arrayValue(state.analysis?.personaTypes).join(' | ')],['잠재 Needs',arrayValue(state.analysis?.needs).join(' | ')],['Search Expansion',unique([state.analysis?.keywords,state.analysis?.expandedKeywords,state.analysis?.bilingualTerms].flatMap(arrayValue)).join(' | ')]];
        const recommended=state.recommendations.map((row,index)=>({추천순위:index+1,이름:personaName(row),성별:textValue(row['성별']??row.Gender),나이:textValue(row['나이']??row['연령']??row.Age),직업:textValue(row['직업']??row['직업 페르소나']??row.Occupation),지역:textValue(row['시도/주']??row['지역']??row.Location),인터뷰적합도:Math.round(row.score||0),핵심특징:arrayValue(row.evaluation?.coreFeatures).join(' | '),관련경험:arrayValue(row.evaluation?.experiences).join(' | '),상세추천사유:row.evaluation?.reason||'',기대인터뷰관점:row.evaluation?.interviewPerspective||'',주요근거:evaluationEvidence(row.evaluation).map(value=>`${value.field||'원본 근거'}: ${value.evidence||''}`).join(' | ')})),details=state.recommendations.map(row=>Object.fromEntries(state.fields.map(field=>[field,row[field]])));
        const interviewQuestions=state.interviews.flatMap((session,sessionIndex)=>session.questions.map((question,index)=>({인터뷰회차:sessionIndex+1,Persona이름:session.personaName,질문순서:index+1,인터뷰질문:question}))),interviewResults=state.interviews.flatMap((session,sessionIndex)=>session.result.qaPairs.map((pair,index)=>({인터뷰회차:sessionIndex+1,Persona이름:session.personaName,질문구분:index<session.questions.length?'선택 질문':'추가 질문',질문순서:index+1,질문:pair.q,답변:pair.a,인터뷰요약:session.result.summary,핵심인사이트:arrayValue(session.result.keyInsights).join(' | '),진행일시:new Date(session.createdAt).toLocaleString('ko-KR')})));
        XLSX.utils.book_append_sheet(workbook,XLSX.utils.aoa_to_sheet(summary),safeSheetName('Project Summary'));XLSX.utils.book_append_sheet(workbook,XLSX.utils.json_to_sheet(recommended),safeSheetName('Recommended Personas'));XLSX.utils.book_append_sheet(workbook,XLSX.utils.json_to_sheet(details),safeSheetName('Persona Details'));XLSX.utils.book_append_sheet(workbook,XLSX.utils.json_to_sheet(interviewQuestions.length?interviewQuestions:[{안내:'아직 진행된 인터뷰가 없습니다.'}]),safeSheetName('Interview Questions'));XLSX.utils.book_append_sheet(workbook,XLSX.utils.json_to_sheet(interviewResults.length?interviewResults:[{안내:'아직 진행된 인터뷰가 없습니다.'}]),safeSheetName('Interview Results'));
        const safeTopic=state.topic.replace(/[\\/:*?"<>|]/g,' ').trim().replace(/\s+/g,'_').slice(0,42)||'project',fileName=`${safeTopic}_Persona리서치_${new Date().toISOString().slice(0,10)}.xlsx`;XLSX.writeFile(workbook,fileName,{compression:true});state.screen='done';render();
      }catch(error){showToast(`Excel 저장 중 문제가 발생했습니다: ${error.message}`,4200)}
    }
    function renderDone(app){app.innerHTML=`<div class="screen fade-in">${headerTemplate()}<main class="done-screen"><div class="done-mark"><i data-lucide="check"></i></div><h1>리서치 결과를 저장했습니다.</h1><p>추천 Persona 10명과 원본 데이터, ${state.interviews.length.toLocaleString()}회의 인터뷰 질문·답변을 하나의 Excel 파일에 담았습니다.</p></main><div class="bottom-bar"><div class="bottom-stack"><button class="btn btn-primary btn-full" id="againButton">새로운 과제 검색 <i data-lucide="refresh-cw"></i></button></div></div></div>`;$('#againButton').onclick=resetProject}
    function resetProject(){Object.assign(state,{projectId:'',pendingProject:null,topic:'',description:'',analysis:null,recommendations:[],candidates:[],candidateCount:0,selectedPersonaId:'',questionGroups:[],selectedQuestionIds:[],interviews:[],activeInterviewId:'',error:'',warning:'',busy:false,phase:'',screen:state.rows.length?'topic':'upload'});render()}

    window.addEventListener('unhandledrejection',event=>{if(event.reason?.name!=='AbortError')console.error('Unhandled promise rejection:',event.reason)});
    window.addEventListener('error',event=>console.error('Application error:',event.error||event.message));
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistCurrentProject().catch(()=>{})});
    window.addEventListener('pagehide',()=>{persistCurrentProject().catch(()=>{})});
    render();refreshProjectList().then(()=>{if(state.screen==='upload')render({preserveScroll:true})}).catch(error=>console.error('Project list load failed:',error));
  })();
  </script>
